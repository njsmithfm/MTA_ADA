name: Weekly MTA Dashboard Update
on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays at 13:00 UTC
  workflow_dispatch:       # allow manual runs

jobs:
  update-charts:
    runs-on: ubuntu-latest

    steps:
 
      - uses: actions/checkout@v3


      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

 
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

   
      - name: Install Python deps
        run: |
          # If you have a requirements.txt, use it:
          # pip install -r requirements.txt
          pip install requests pandas python-dateutil python-dotenv

  
      - name: Connectivity sanity check 
        run: |
          echo "=== Checking generic HTTPS connectivity ==="
          curl -I https://www.google.com || true

          echo "=== Checking the MTA API endpoint ==="
       
          curl -v "https://data.ny.gov/resource/thh2-syn7.json" || true


      - name: Run updateCharts with retries       
        env:
          DATAWRAPPER_TOKEN: ${{ secrets.DATAWRAPPER_TOKEN }}
        run: |
          max_attempts=3
          attempt=1
          until python updateCharts.py; do
            echo "Attempt $attempt failed."
            ((attempt++))
            if (( attempt > max_attempts )); then
              echo "All attempts failed – exiting."
              exit 1
            fi
            echo "Waiting $((attempt * 10)) seconds before next try..."
            sleep $((attempt * 10))
          done